name: Changeset

# A PR into develop that changes shipping code (packages/design-system/src or packages/cli/src, or
# packages/cli/package.json, minus stories, tests, snapshots, Figma specs and docs pages; or the
# skills in packages/skills) must add a file in .changeset/. Nothing to release:
# `pnpm changeset --empty`. Same rule as the pre-push hook: scripts/check-changeset.mjs.
#
# Its own workflow, not a job in build.yaml, for two reasons:
# - PRs into feature/** (a stack) run build.yaml too, and a job skipped by `if:` reports success.
#   That skipped result would satisfy develop's required "Changeset present" check once the PR is
#   retargeted. Here a PR into feature/** gets no "Changeset present" result at all.
# - `edited` covers the retarget: changing a PR's base to develop runs the check. build.yaml does
#   not list `edited`, so a title or body edit does not rerun the whole build; here it reruns only
#   this short check.
concurrency:
  group: changeset-${{ github.event.pull_request.number }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - develop

jobs:
  changeset:
    name: Changeset present
    # The Version PR consumes changesets; it never adds one.
    if: ${{ !startsWith(github.head_ref, 'changeset-release/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check for a changeset
        run: node scripts/check-changeset.mjs origin/${{ github.base_ref }} HEAD
